<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股投資分析報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens (Light / Warm Parchment) ──────────────────── */
:root {
  --bg:        #faf8f4;
  --surface:   #ffffff;
  --surface-2: #f5f1e8;
  --border:    #e8e2d6;
  --border-hi: #cdc6b8;

  --text-1:    #1e1b16;
  --text-2:    #5a5347;
  --text-3:    #9a9186;

  --gold:      #7d5a1e;
  --gold-dim:  #7d5a1e0f;
  --gold-mid:  #a8782a;

  --gain:      #1a6b3a;
  --gain-dim:  #1a6b3a0e;
  --loss:      #b5293a;
  --loss-dim:  #b5293a0e;

  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'Plus Jakarta Sans', system-ui, sans-serif;
  --mono:      'JetBrains Mono', monospace;

  --max-w:     760px;
  --r:         6px;
}

/* ── Reset ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page shell ──────────────────────────────────────────────── */
.page { max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem 6rem; }

/* ── Masthead ────────────────────────────────────────────────── */
.masthead {
  padding: 3.5rem 0 2.5rem;
  border-bottom: 2px solid var(--text-1);
  margin-bottom: 3rem;
}
.masthead-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 1.5rem;
}
.masthead-meta .badge {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  font-size: 10px;
}
.masthead-title {
  font-family: var(--serif);
  font-size: clamp(2.6rem, 8vw, 4.2rem);
  font-weight: 600;
  font-style: italic;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--text-1);
  margin-bottom: 1rem;
}
.masthead-sub {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: var(--text-2);
  letter-spacing: 0.01em;
}

/* ── Report body: headings ───────────────────────────────────── */
#report-content h2 {
  font-family: var(--serif);
  font-size: clamp(1.35rem, 4vw, 1.75rem);
  font-weight: 600;
  font-style: italic;
  color: var(--text-1);
  line-height: 1.25;
  margin-top: 3rem;
  margin-bottom: 0.9rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
}
#report-content h3 {
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-mid);
  margin-top: 2rem;
  margin-bottom: 0.75rem;
}

/* ── Paragraphs ──────────────────────────────────────────────── */
#report-content p {
  color: var(--text-2);
  line-height: 1.8;
  margin-bottom: 0.9rem;
  font-size: 0.95rem;
}

/* ── Top-level list (default) ────────────────────────────────── */
#report-content > ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
#report-content > ul > li {
  position: relative;
  padding: 0.7rem 0.9rem 0.7rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 2px solid var(--border-hi);
  border-radius: var(--r);
  color: var(--text-2);
  font-size: 0.9rem;
  line-height: 1.65;
}
#report-content > ul > li strong {
  color: var(--text-1);
  font-weight: 600;
}

/* ── Stock position cards ────────────────────────────────────── */
#report-content > ul > li.stock-card {
  border-left: 2px solid var(--border-hi);
  background: var(--surface);
  padding: 0.9rem 1rem;
}
#report-content > ul > li.stock-card > p {
  margin: 0 0 0.6rem;
}
#report-content > ul > li.stock-card > p > strong,
#report-content > ul > li.stock-card > strong {
  display: block;
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-1);
}
#report-content > ul > li.stock-card > ul {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 0.3rem 1rem;
}
#report-content > ul > li.stock-card > ul > li {
  font-size: 0.81rem;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#report-content > ul > li.stock-card > ul > li .val {
  font-family: var(--mono);
  font-size: 0.81rem;
  color: var(--text-2);
}
#report-content > ul > li.stock-card .pnl-gain {
  font-family: var(--mono);
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--gain);
}
#report-content > ul > li.stock-card .pnl-loss {
  font-family: var(--mono);
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--loss);
}
#report-content > ul > li.stock-card.is-gain {
  border-left-color: var(--gain);
  background: linear-gradient(90deg, var(--gain-dim) 0%, transparent 55%);
}
#report-content > ul > li.stock-card.is-loss {
  border-left-color: var(--loss);
  background: linear-gradient(90deg, var(--loss-dim) 0%, transparent 55%);
}

/* ── News cards (individual stock news) ─────────────────────── */
#report-content > ul > li.news-card {
  background: var(--surface);
  padding: 0.9rem 1rem;
}
#report-content > ul > li.news-card > p {
  margin: 0 0 0.5rem;
}
#report-content > ul > li.news-card > p > strong,
#report-content > ul > li.news-card > strong {
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--gold-mid);
  text-transform: uppercase;
}
#report-content > ul > li.news-card > ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
#report-content > ul > li.news-card > ul > li {
  font-size: 0.86rem;
  color: var(--text-2);
  line-height: 1.55;
  padding-left: 0.9rem;
  position: relative;
  white-space: normal;
}
#report-content > ul > li.news-card > ul > li::before {
  content: '–';
  position: absolute;
  left: 0;
  color: var(--text-3);
}

/* ── HR ──────────────────────────────────────────────────────── */
#report-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.5rem 0;
}

/* ── Blockquote ──────────────────────────────────────────────── */
#report-content blockquote {
  border-left: 2px solid var(--gold-mid);
  padding: 0.6rem 1rem;
  color: var(--text-3);
  font-size: 0.82rem;
  font-style: italic;
  background: var(--surface-2);
  border-radius: 0 var(--r) var(--r) 0;
  margin: 1rem 0;
}

/* ── Fear & Greed callout ────────────────────────────────────── */
.fg-callout {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold-mid);
  border-radius: var(--r);
  padding: 1rem 1.25rem;
  margin: 1.25rem 0;
}
.fg-score {
  font-family: var(--mono);
  font-size: 2rem;
  font-weight: 500;
  line-height: 1;
  color: var(--gold);
  min-width: 3ch;
}
.fg-label {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: var(--text-1);
}
.fg-desc {
  font-size: 0.78rem;
  color: var(--text-3);
  margin-top: 0.15rem;
}

/* ── Footer ──────────────────────────────────────────────────── */
.report-footer {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-3);
  font-size: 0.73rem;
  letter-spacing: 0.04em;
  line-height: 1.9;
}

/* ── Expired state ───────────────────────────────────────────── */
.expired {
  text-align: center;
  padding: 5rem 2rem;
}
.expired-icon { font-size: 2.5rem; margin-bottom: 1rem; }
.expired h2 {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  color: var(--text-1);
  margin-bottom: 0.5rem;
}
.expired p { color: var(--text-3); font-size: 0.88rem; }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 580px) {
  .masthead { padding: 2.5rem 0 1.75rem; }
  #report-content h2 { font-size: 1.35rem; }
  #report-content > ul > li.stock-card > ul {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="masthead-meta">
      <span id="report-date"></span>
      <span class="badge">AI 生成 · 僅供參考</span>
    </div>
    <h1 class="masthead-title">美股投資<br>分析報告</h1>
    <p class="masthead-sub">每日持倉摘要 · 市場情緒 · 個股要聞</p>
  </header>

  <!-- 報告已過期 -->
  <div th:if="${expired}" class="expired">
    <div class="expired-icon">⏰</div>
    <h2>報告連結已失效</h2>
    <p>報告僅保留 24 小時，請透過 LINE 重新觸發 <code>/stock</code> 取得最新報告。</p>
  </div>

  <!-- 報告內容 -->
  <div th:if="${content}" id="report-content" th:attr="data-markdown=${content}"></div>

  <!-- Footer -->
  <footer th:if="${content}" class="report-footer">
    由 NexRailAI 生成 · Powered by Gemini 2.5 Flash<br>
    本報告僅供資訊參考，不構成任何投資建議。投資有風險，入市需謹慎。
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ── Set today's date ──────────────────────────────────────────
const now = new Date();
const dateEl = document.getElementById('report-date');
if (dateEl) {
  dateEl.textContent = now.toLocaleDateString('zh-TW', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
  });
}

// ── Render markdown from Thymeleaf data attribute ─────────────
const el = document.getElementById('report-content');
if (el) {
  const raw = el.getAttribute('data-markdown');
  el.removeAttribute('data-markdown');
  el.innerHTML = marked.parse(raw);

  // ── Post-process: enrich the rendered DOM ──────────────────
  (function postProcess() {

    // 1. Classify & style nested list items
    el.querySelectorAll('ul > li').forEach(li => {
      const strong = li.querySelector(':scope > p > strong') || li.querySelector(':scope > strong');
      const nested = li.querySelector(':scope > ul');
      if (!strong || !nested) return;

      // Detect stock position card (has 持股數 / 損益百分比)
      const nestedItems = Array.from(nested.querySelectorAll('li'));
      const isPosition = nestedItems.some(item =>
        item.textContent.includes('持股數') || item.textContent.includes('損益百分比')
      );

      if (isPosition) {
        // ── Stock position card ──
        li.classList.add('stock-card');
        let pnlClass = '';

        nestedItems.forEach(detail => {
          const txt = detail.textContent;
          if (txt.includes('損益百分比')) {
            const isGain = txt.includes('+');
            const isLoss = txt.includes('-') && !txt.includes('備註');
            pnlClass = isGain ? 'is-gain' : (isLoss ? 'is-loss' : '');
            const colon = txt.indexOf('：');
            if (colon !== -1) {
              const label = txt.slice(0, colon + 1);
              const value = txt.slice(colon + 1).trim();
              const cls = isGain ? 'pnl-gain' : (isLoss ? 'pnl-loss' : '');
              detail.innerHTML = `<span style="color:var(--text-3)">${label}</span> <span class="${cls}">${value}</span>`;
            }
          } else {
            const colon = txt.indexOf('：');
            if (colon !== -1) {
              const label = txt.slice(0, colon + 1);
              const value = txt.slice(colon + 1).trim();
              detail.innerHTML = `<span style="color:var(--text-3)">${label}</span> <span class="val">${value}</span>`;
            }
          }
        });

        if (pnlClass) li.classList.add(pnlClass);

      } else {
        // ── News card ──
        li.classList.add('news-card');
      }
    });

    // 2. Fear & Greed callout
    el.querySelectorAll('p').forEach(p => {
      const txt = p.textContent;
      const match = txt.match(/恐慌貪婪指數.*?([極度恐慌|恐慌|中性|貪婪|極度貪婪]+)\s*\((\d+)\)/);
      if (match) {
        const rating = match[1];
        const score  = match[2];
        const rest   = txt.replace(txt.slice(0, txt.indexOf('根據')), '').trim();

        const card = document.createElement('div');
        card.className = 'fg-callout';
        card.innerHTML = `
          <div class="fg-score">${score}</div>
          <div>
            <div class="fg-label">${rating}</div>
            <div class="fg-desc">CNN 恐慌貪婪指數</div>
          </div>`;

        p.parentNode.insertBefore(card, p);

        p.textContent = rest.replace(/根據 CNN 恐慌貪婪指數顯示，當前市場情緒為 \S+ \(\d+\)。/, '').trim();
        if (!p.textContent) p.remove();
      }
    });

  })();
}
</script>
</body>
</html>
