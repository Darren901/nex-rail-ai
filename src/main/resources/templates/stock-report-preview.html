<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股投資分析報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens (Light / Warm Parchment) ──────────────────── */
:root {
  --bg:        #faf8f4;
  --surface:   #ffffff;
  --surface-2: #f5f1e8;
  --border:    #e8e2d6;
  --border-hi: #cdc6b8;

  --text-1:    #1e1b16;
  --text-2:    #5a5347;
  --text-3:    #9a9186;

  --gold:      #7d5a1e;
  --gold-dim:  #7d5a1e0f;
  --gold-mid:  #a8782a;

  --gain:      #1a6b3a;
  --gain-dim:  #1a6b3a0e;
  --loss:      #b5293a;
  --loss-dim:  #b5293a0e;

  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'Plus Jakarta Sans', system-ui, sans-serif;
  --mono:      'JetBrains Mono', monospace;

  --max-w:     760px;
  --r:         6px;
}

/* ── Reset ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page shell ──────────────────────────────────────────────── */
.page { max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem 6rem; }

/* ── Masthead ────────────────────────────────────────────────── */
.masthead {
  padding: 3.5rem 0 2.5rem;
  border-bottom: 2px solid var(--text-1);
  margin-bottom: 3rem;
}
.masthead-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 1.5rem;
}
.masthead-meta .badge {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  font-size: 10px;
}
.masthead-title {
  font-family: var(--serif);
  font-size: clamp(2.6rem, 8vw, 4.2rem);
  font-weight: 600;
  font-style: italic;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--text-1);
  margin-bottom: 1rem;
}
.masthead-sub {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: var(--text-2);
  letter-spacing: 0.01em;
}

/* ── Report body: headings ───────────────────────────────────── */
#report-content h2 {
  font-family: var(--serif);
  font-size: clamp(1.35rem, 4vw, 1.75rem);
  font-weight: 600;
  font-style: italic;
  color: var(--text-1);
  line-height: 1.25;
  margin-top: 3rem;
  margin-bottom: 0.9rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
}
#report-content h3 {
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-mid);
  margin-top: 2rem;
  margin-bottom: 0.75rem;
}

/* ── Paragraphs ──────────────────────────────────────────────── */
#report-content p {
  color: var(--text-2);
  line-height: 1.8;
  margin-bottom: 0.9rem;
  font-size: 0.95rem;
}

/* ── Top-level list (default) ────────────────────────────────── */
#report-content > ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
#report-content > ul > li {
  position: relative;
  padding: 0.7rem 0.9rem 0.7rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 2px solid var(--border-hi);
  border-radius: var(--r);
  color: var(--text-2);
  font-size: 0.9rem;
  line-height: 1.65;
}
#report-content > ul > li strong {
  color: var(--text-1);
  font-weight: 600;
}

/* ── Stock position cards ────────────────────────────────────── */
#report-content > ul > li.stock-card {
  border-left: 2px solid var(--border-hi);
  background: var(--surface);
  padding: 0.9rem 1rem;
}
#report-content > ul > li.stock-card > p {
  margin: 0 0 0.6rem;
}
#report-content > ul > li.stock-card > p > strong,
#report-content > ul > li.stock-card > strong {
  display: block;
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-1);
}
#report-content > ul > li.stock-card > ul {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 0.3rem 1rem;
}
#report-content > ul > li.stock-card > ul > li {
  font-size: 0.81rem;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#report-content > ul > li.stock-card > ul > li .val {
  font-family: var(--mono);
  font-size: 0.81rem;
  color: var(--text-2);
}
#report-content > ul > li.stock-card .pnl-gain {
  font-family: var(--mono);
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--gain);
}
#report-content > ul > li.stock-card .pnl-loss {
  font-family: var(--mono);
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--loss);
}
#report-content > ul > li.stock-card.is-gain {
  border-left-color: var(--gain);
  background: linear-gradient(90deg, var(--gain-dim) 0%, transparent 55%);
}
#report-content > ul > li.stock-card.is-loss {
  border-left-color: var(--loss);
  background: linear-gradient(90deg, var(--loss-dim) 0%, transparent 55%);
}

/* ── News cards (individual stock news) ─────────────────────── */
#report-content > ul > li.news-card {
  background: var(--surface);
  padding: 0.9rem 1rem;
}
#report-content > ul > li.news-card > p {
  margin: 0 0 0.5rem;
}
#report-content > ul > li.news-card > p > strong,
#report-content > ul > li.news-card > strong {
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--gold-mid);
  text-transform: uppercase;
}
#report-content > ul > li.news-card > ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
#report-content > ul > li.news-card > ul > li {
  font-size: 0.86rem;
  color: var(--text-2);
  line-height: 1.55;
  padding-left: 0.9rem;
  position: relative;
  white-space: normal;
}
#report-content > ul > li.news-card > ul > li::before {
  content: '–';
  position: absolute;
  left: 0;
  color: var(--text-3);
}

/* ── HR ──────────────────────────────────────────────────────── */
#report-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.5rem 0;
}

/* ── Blockquote ──────────────────────────────────────────────── */
#report-content blockquote {
  border-left: 2px solid var(--gold-mid);
  padding: 0.6rem 1rem;
  color: var(--text-3);
  font-size: 0.82rem;
  font-style: italic;
  background: var(--surface-2);
  border-radius: 0 var(--r) var(--r) 0;
  margin: 1rem 0;
}

/* ── Fear & Greed callout ────────────────────────────────────── */
.fg-callout {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold-mid);
  border-radius: var(--r);
  padding: 1rem 1.25rem;
  margin: 1.25rem 0;
}
.fg-score {
  font-family: var(--mono);
  font-size: 2rem;
  font-weight: 500;
  line-height: 1;
  color: var(--gold);
  min-width: 3ch;
}
.fg-label {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-style: italic;
  color: var(--text-1);
}
.fg-desc {
  font-size: 0.78rem;
  color: var(--text-3);
  margin-top: 0.15rem;
}

/* ── Footer ──────────────────────────────────────────────────── */
.report-footer {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-3);
  font-size: 0.73rem;
  letter-spacing: 0.04em;
  line-height: 1.9;
}

/* ── Expired state ───────────────────────────────────────────── */
.expired {
  text-align: center;
  padding: 5rem 2rem;
}
.expired-icon { font-size: 2.5rem; margin-bottom: 1rem; }
.expired h2 {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  color: var(--text-1);
  margin-bottom: 0.5rem;
}
.expired p { color: var(--text-3); font-size: 0.88rem; }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 580px) {
  .masthead { padding: 2.5rem 0 1.75rem; }
  #report-content h2 { font-size: 1.35rem; }
  #report-content > ul > li.stock-card > ul {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="masthead-meta">
      <span id="report-date"></span>
      <span class="badge">AI 生成 · 僅供參考</span>
    </div>
    <h1 class="masthead-title">美股投資<br>分析報告</h1>
    <p class="masthead-sub">每日持倉摘要 · 市場情緒 · 個股要聞</p>
  </header>

  <div id="report-content"></div>

  <footer class="report-footer">
    由 NexRailAI 生成 · Powered by Gemini 2.5 Flash<br>
    本報告僅供資訊參考，不構成任何投資建議。投資有風險，入市需謹慎。
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const MARKDOWN = `## 每日美股投資摘要報告

**發布日期：** 今日

### 市場整體情緒與解讀
根據 CNN 恐慌貪婪指數顯示，當前市場情緒為 **中性 (52)**。市場情緒趨於平衡，多空力道相當，短期方向尚不明朗，建議持倉者維持既有策略，靜待明確突破訊號。

### 重要新聞摘要與潛在影響
*   **科技股財報季即將登場：** 下週起各大科技公司陸續公布季報，市場預期整體獲利成長，但任何低於預期的數字都可能引發短暫波動。
*   **聯準會利率會議紀錄公布：** 最新會議紀錄顯示委員們對通膨路徑意見分歧，市場對年內降息次數預期再度下調。
*   **AI 基礎設施投資持續加碼：** 主要雲端服務商宣布大幅提升資本支出，重點投入 GPU 叢集與資料中心擴建，有助於相關供應鏈受惠。
*   **能源價格上揚帶動通膨疑慮：** 油價因地緣政治緊張再度走升，市場擔憂輸入性通膨可能延緩降息時程。

### 各持倉股價與損益概況

*   **AAAA (Alpha Corp)**
    *   持股數：10 股
    *   平均成本：$100.00 USD
    *   最新收盤價：$118.50 USD
    *   損益百分比：+18.50%
    *   備註：示範持倉 A

*   **BBBB (Beta Inc)**
    *   持股數：8 股
    *   平均成本：$250.00 USD
    *   最新收盤價：$231.40 USD
    *   損益百分比：-7.44%
    *   備註：示範持倉 B

*   **CCCC (Gamma Ltd)**
    *   持股數：5 股
    *   平均成本：$80.00 USD
    *   最新收盤價：$82.30 USD
    *   損益百分比：+2.88%
    *   備註：示範持倉 C

### 各持倉個股近期要聞

*   **AAAA (Alpha Corp):**
    *   Alpha Corp 宣布與主要零售商達成五年獨家合作協議，擴大通路覆蓋範圍。
    *   分析師將目標價上調至 $135，維持買入評級，看好下半年營收加速。
    *   公司完成新一輪股票回購計畫，規模達 20 億美元，展現管理層信心。

*   **BBBB (Beta Inc):**
    *   Beta Inc 第二季毛利率低於市場預期，成本壓力來自原物料漲價與物流費用上升。
    *   執行長於法人說明會表示，正積極評估非核心業務的資產出售以改善資產負債表。
    *   競爭對手推出相似產品，市場份額面臨短期壓力，需持續觀察後續動態。

*   **CCCC (Gamma Ltd):**
    *   Gamma Ltd 獲得政府補貼資格，將加速東南亞市場擴張計畫。
    *   新任技術長上任，帶來前公司的 AI 產品開發經驗，市場反應正面。
    *   本季自由現金流轉正，為近三年首次，財務體質明顯改善。

### 整體投資組合評估
目前市場情緒處於「中性」區間，無明確多空偏向。組合中 AAAA 及 CCCC 維持獲利，BBBB 因基本面壓力出現回檔。

長線投資者建議定期檢視各持股的基本面變化，在市場波動加大的財報季期間，適度分散持倉風險，避免單一標的過度集中。

---
**免責聲明：** 本報告內容為示範用途，數據均為虛構，不構成任何投資建議。投資有風險，入市需謹慎。`;

// ── Set today's date ──────────────────────────────────────────
const now = new Date();
document.getElementById('report-date').textContent =
  now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

// ── Render markdown ───────────────────────────────────────────
const el = document.getElementById('report-content');
el.innerHTML = marked.parse(MARKDOWN);

// ── Post-process: enrich the rendered DOM ────────────────────
(function postProcess() {

  // 1. Classify & style nested list items
  el.querySelectorAll('ul > li').forEach(li => {
    const strong = li.querySelector(':scope > p > strong') || li.querySelector(':scope > strong');
    const nested = li.querySelector(':scope > ul');
    if (!strong || !nested) return;

    // Detect if this is a stock position card (has 持股數 / 損益百分比)
    const nestedItems = Array.from(nested.querySelectorAll('li'));
    const isPosition = nestedItems.some(item =>
      item.textContent.includes('持股數') || item.textContent.includes('損益百分比')
    );

    if (isPosition) {
      // ── Stock position card ──
      li.classList.add('stock-card');
      let pnlClass = '';

      nestedItems.forEach(detail => {
        const txt = detail.textContent;
        if (txt.includes('損益百分比')) {
          const isGain = txt.includes('+');
          const isLoss = txt.includes('-') && !txt.includes('備註');
          pnlClass = isGain ? 'is-gain' : (isLoss ? 'is-loss' : '');
          const colon = txt.indexOf('：');
          if (colon !== -1) {
            const label = txt.slice(0, colon + 1);
            const value = txt.slice(colon + 1).trim();
            const cls = isGain ? 'pnl-gain' : (isLoss ? 'pnl-loss' : '');
            detail.innerHTML = `<span style="color:var(--text-3)">${label}</span> <span class="${cls}">${value}</span>`;
          }
        } else {
          const colon = txt.indexOf('：');
          if (colon !== -1) {
            const label = txt.slice(0, colon + 1);
            const value = txt.slice(colon + 1).trim();
            detail.innerHTML = `<span style="color:var(--text-3)">${label}</span> <span class="val">${value}</span>`;
          }
        }
      });

      if (pnlClass) li.classList.add(pnlClass);

    } else {
      // ── News card ──
      li.classList.add('news-card');
    }
  });

  // 2. Fear & Greed callout
  el.querySelectorAll('p').forEach(p => {
    const txt = p.textContent;
    const match = txt.match(/恐慌貪婪指數.*?(極度恐慌|恐慌|中性|貪婪|極度貪婪)\s*\((\d+)\)/);
    if (match) {
      const rating = match[1];
      const score  = match[2];
      const rest   = txt.replace(txt.slice(0, txt.indexOf('根據')), '').trim();

      const card = document.createElement('div');
      card.className = 'fg-callout';
      card.innerHTML = `
        <div class="fg-score">${score}</div>
        <div>
          <div class="fg-label">${rating}</div>
          <div class="fg-desc">CNN 恐慌貪婪指數</div>
        </div>`;

      p.parentNode.insertBefore(card, p);

      p.textContent = rest.replace(/根據 CNN 恐慌貪婪指數顯示，當前市場情緒為 \S+ \(\d+\)。/, '').trim();
      if (!p.textContent) p.remove();
    }
  });

})();
</script>
</body>
</html>
