<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳轉...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(30deg, #001f3f 0%, #0074D9 50%, #7FDBFF 100%);
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .icon {
            display: inline-block;
            margin-bottom: 1rem;
            animation: bounce 1s infinite;
        }

        .icon img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .manual-link {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .manual-link a {
            color: white;
            text-decoration: underline;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">
        <!-- 簡約的火車 SVG 圖示，體積極小且無需下載 -->
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11V19C4 20.1046 4.89543 21 6 21H18C19.1046 21 20 20.1046 20 19V11M4 11V7C4 5.89543 4.89543 5 6 5H18C19.1046 5 20 5.89543 20 7V11M4 11H20M12 5V3M7 5L6 3M17 5L18 3M16 11V15M8 11V15M12 11V15M6 21V22M18 22V21" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="7" y="17" width="2" height="2" rx="1" fill="white"/>
            <rect x="15" y="17" width="2" height="2" rx="1" fill="white"/>
        </svg>
    </div>
    <h1>正在為您開啟 T-EX 行動購票...</h1>
    <div class="spinner"></div>
    <p>如果沒有自動跳轉，請點擊下方連結</p>

    <div class="manual-link">
        <a th:href="${targetUrl}" id="manualLink">點此手動開啟</a>
    </div>
</div>

<script th:inline="javascript">
    // 從後端取得目標網址
    const targetUrl = /*[[${targetUrl}]]*/ '';

    // 立即跳轉
    if (targetUrl) {
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 500);
    }
</script>
</body>
</html>
