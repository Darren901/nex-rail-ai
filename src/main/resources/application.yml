spring:
  application:
    name: NexRailAI
  profiles:
    active: dev
  config:
    import:
      - classpath:sensitive.yml
      - classpath:application-prompts.yml
  # File upload configuration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  
  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      
  # AI configuration
  ai:
    # Google GenAI Gemini
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.4
    chat:
      client:
        observations:
          log-completion: true
# Server configuration
server:
  port: 8089

# Logging configuration
logging:
  level.com.next.nexrailai: DEBUG

# TDX
tdx:
  client-id: ${TDX_CLIENT_ID}
  client-secret: ${TDX_CLIENT_SECRET}
  base-url: https://tdx.transportdata.tw

# Line Bot
line:
  bot:
    channel-token: ${LINE_BOT_TOKEN}
    channel-secret: ${LINE_BOT_SECRET}
    handler:
      path: /callback

