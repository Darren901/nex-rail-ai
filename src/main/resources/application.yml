spring:
  application:
    name: NexRailAI
  profiles:
    active: dev
  config:
    import:
      - optional:classpath:application-sensitive.yml
      - optional:classpath:application-prompts.yml
  # File upload configuration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  
  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      
  # AI configuration
  ai:
    # Google GenAI Gemini
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.4
    chat:
      client:
        observations:
          log-completion: true
# Server configuration
server:
  port: 8089

# Logging configuration
logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/application-%d{yyyy-MM-dd}.%i.log

# TDX
tdx:
  client-id: ${TDX_CLIENT_ID}
  client-secret: ${TDX_CLIENT_SECRET}
  base-url: https://tdx.transportdata.tw

# Line Bot
line:
  bot:
    channel-token: ${LINE_BOT_TOKEN}
    channel-secret: ${LINE_BOT_SECRET}
    handler:
      path: /callback

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-milliseconds: ${JWT_EXPIRATION_MILLISECONDS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  redirect:
    allowed-hosts: ${APP_REDIRECT_ALLOWED_HOSTS:irs.thsrc.com.tw,www.thsrc.com.tw,tdx.transportdata.tw,maas.transportdata.tw}

management:
  endpoints:
    web:
      exposure:
        include: health
