spring:
  # Database configuration (Local Docker)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/NexRailAI
    username: ${DB_USER_NAME} # Local DB User
    password: ${DB_USER_PASSWORD} # Local DB Password
  # Docker Compose (Auto-start for Dev)
  docker:
    compose:
      enabled: true
      file: compose.yaml
  
  # Dev-specific logging
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# Application Config (Dev)
app:
  base-url: https://3dc2c703048e.ngrok-free.app